issuer: https://token.actions.githubusercontent.com
# Tags follow the cog monorepo default (and the Dart ecosystem
# convention used by melos, Riverpod, Bloc, Drift): <pkg>-v<semver>,
# e.g. core-v0.0.2 or oauth-v0.0.1. Keep this list aligned with the
# tag filter in release-dart.yml and the parser in mise.toml's
# release:parse-tag.
subject_pattern: "repo:Pinguteca/sdk-core-dart:ref:refs/tags/(core|oauth)-v.*"
claim_pattern:
  workflow_ref: "Pinguteca/sdk-core-dart/\\.github/workflows/release-(go|dotnet|dart)\\.yml@refs/tags/(core|oauth)-v.*"
permissions:
  contents: write
