name: Release (Dart)

on:
  push:
    # Per-package tags follow the cog monorepo default (and the Dart
    # ecosystem convention used by melos, Riverpod, Bloc, Drift):
    # <pkg>-v<semver>, e.g. core-v0.0.2 or oauth-v0.0.1. Keep this list
    # aligned with the keys in cog.toml's [monorepo.packages] section.
    tags:
      - "core-v*"
      - "oauth-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  MISE_ENV: ci

jobs:
  release:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # octo-sts, cosign keyless signing and pub.dev trusted publishing
      contents: write # gh release create writes the GitHub Release
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo: "true"
      - name: Obtain release token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-dart
          identity: release
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Install mise and tools
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          experimental: true
          install: true
          # Never restore a CI cache: a poisoned entry would feed builds and
          # releases.
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Parse release tag
        # The cog monorepo convention with monorepo_version_separator = "/"
        # yields tags shaped <pkg>/v<semver>. The mise task slices the tag
        # into RELEASE_PKG_DIR / RELEASE_VERSION / RELEASE_PKG_NAME and
        # is callable locally for dry runs.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run release:parse-tag >> "$GITHUB_ENV"
      - name: Verify pubspec version matches tag
        # cog produces the bump commit and tag atomically, so the tagged
        # commit must already carry the matching version in
        # packages/$RELEASE_PKG_DIR/pubspec.yaml. dart pub publish rejects
        # a modified-since-commit pubspec; this step fails fast if the
        # tag and pubspec diverged.
        run: mise run release:verify-version
      - name: Fetch dependencies
        run: mise run ci:get
      - name: Dry-run publish
        # Catches manifest issues before the OIDC token is consumed.
        run: mise run release:dry-run
      # pub.dev Trusted Publishing: setup-dart exchanges the workflow's
      # OIDC token for a short-lived publish credential at push time. The
      # pub.dev package admin must list this workflow under its
      # automated-publishing settings.
      # See https://dart.dev/tools/pub/automated-publishing
      - name: Setup Dart for trusted publishing
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - name: Run dart pub publish
        run: mise run release:publish
      - name: Generate SBOM
        run: mise run release:sbom
      - name: Compute checksums
        run: |
          mkdir -p out
          sha256sum \
            "packages/${RELEASE_PKG_DIR}/pubspec.yaml" \
            "out/sbom/${RELEASE_PKG_NAME}.cdx.json" \
            > out/checksums.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums
        run: |
          cd out
          cosign sign-blob \
            --bundle=checksums.txt.sigstore.json \
            --yes \
            checksums.txt
      - name: Compute SLSA subject hashes
        id: hash
        run: |
          echo "hashes=$(base64 -w0 out/checksums.txt)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            "out/sbom/${RELEASE_PKG_NAME}.cdx.json" \
            out/checksums.txt \
            out/checksums.txt.sigstore.json

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read # SLSA generator reads this run's metadata
      id-token: write # OIDC token signs the provenance
      contents: write # upload the provenance to the GitHub Release
    # The generator rejects SHA pins; it must be a tag (see .github/pinact.yml).
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: false
      provenance-name: provenance.intoto.jsonl
      private-repository: false
