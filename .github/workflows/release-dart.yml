name: Release (Dart)

on:
  push:
    # Per-package tags. Format: <pkg-dir>-v<semver>, e.g. core-v0.0.2 or
    # oauth-v0.0.1. The mise release:parse-tag task is the canonical
    # parser; keep this filter aligned with the packages it recognises.
    tags: ["core-v*", "oauth-v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  MISE_ENV: ci

jobs:
  release:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo: "true"
      - name: Obtain release token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguteca/sdk-core-dart
          identity: release
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.octo-sts.outputs.token }}
      - name: Install mise and tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Parse release tag
        # Writes RELEASE_PKG_DIR / RELEASE_VERSION / RELEASE_PKG_NAME into
        # $GITHUB_ENV so every subsequent step inherits them. The same
        # mise task is callable locally for dry runs.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run release:parse-tag >> "$GITHUB_ENV"
      - name: Verify pubspec version matches tag
        # The tagged commit must already carry the matching version in
        # packages/$RELEASE_PKG_DIR/pubspec.yaml so the publish has a
        # clean tree (dart pub publish rejects a modified-since-commit
        # pubspec). cog bump or a manual edit handles the bump before
        # tagging; this step fails fast if the tag and pubspec diverge.
        run: mise run release:verify-version
      - name: Fetch dependencies
        run: mise run ci:get
      - name: Dry-run publish
        # Catches manifest issues before the OIDC token is consumed.
        run: mise run release:dry-run
      # pub.dev Trusted Publishing: setup-dart exchanges the workflow's
      # OIDC token for a short-lived publish credential at push time. The
      # pub.dev package admin must list this workflow under its
      # automated-publishing settings.
      # See https://dart.dev/tools/pub/automated-publishing
      - name: Setup Dart for trusted publishing
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - name: Run dart pub publish
        run: mise run release:publish
      - name: Generate SBOM
        run: mise run release:sbom
      - name: Compute checksums
        run: |
          mkdir -p out
          sha256sum \
            "packages/${RELEASE_PKG_DIR}/pubspec.yaml" \
            "out/sbom/${RELEASE_PKG_NAME}.cdx.json" \
            > out/checksums.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums
        run: |
          cd out
          cosign sign-blob \
            --bundle=checksums.txt.sigstore.json \
            --yes \
            checksums.txt
      - name: Compute SLSA subject hashes
        id: hash
        run: |
          echo "hashes=$(base64 -w0 out/checksums.txt)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            "out/sbom/${RELEASE_PKG_NAME}.cdx.json" \
            out/checksums.txt \
            out/checksums.txt.sigstore.json

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: false
      provenance-name: provenance.intoto.jsonl
      private-repository: true
