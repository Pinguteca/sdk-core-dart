name: Verify Commit Signatures

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Sigstore commit signatures
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: "true"
          disable-sudo-and-containers: "true"
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitsign
        uses: chainguard-dev/actions/setup-gitsign@7bd1e94b2a1b7faa891392757de7d89489070c5c # v1.6.32
      - name: Verify every commit in PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Allows any @pinguteca.com identity once the org email is
          # provisioned, plus any @gmail.com identity as a transition
          # allowance while the maintainer's GitHub primary email is
          # still personal. Tighten to ^.*@pinguteca\.com$ once every
          # active committer has a verified @pinguteca.com GitHub
          # primary email.
          for sha in $(git rev-list "$BASE..$HEAD"); do
            echo "Verifying $sha"
            gitsign verify "$sha" \
              --certificate-identity-regexp="^(.*@gmail\.com|.*@pinguteca\.com)$" \
              --certificate-oidc-issuer="https://github.com/login/oauth"
          done
