[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]

[tools]
"aqua:slsa-verifier" = "2.7.1"

[tasks."ci:git-config"]
run = """
git config --global core.compression 0
git config --global core.fsync -all
"""
description = "Optimize Git config for CI (disable compression, fsync)"

[tasks."ci:get"]
run = "dart pub get --enforce-lockfile"
description = "Restore every workspace package in locked mode (fails on pubspec.lock drift)"
sources = ["pubspec.yaml", "pubspec.lock", "packages/*/pubspec.yaml"]
outputs = [".dart_tool/package_config.json"]

[tasks."ci:analyze"]
run = "dart analyze --fatal-infos --fatal-warnings"
description = "Run the Dart analyzer with infos and warnings as failures"
sources = ["packages/**/*.dart", "analysis_options.yaml"]

[tasks."ci:test"]
run = "dart run melos run test:coverage"
description = "Run melos-driven tests with coverage collection per package"
sources = ["packages/**/*.dart", "packages/*/pubspec.yaml", "dart_test.yaml"]
outputs = ["packages/*/coverage/**/*"]

[tasks."ci:format-check"]
run = "dart format --output=none --set-exit-if-changed ."
description = "Verify Dart formatting in CI"
