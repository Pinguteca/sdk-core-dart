tag_prefix = "v"
from_latest_tag = true
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
# Keep the cog default `-` separator: <pkg>-v<semver>. Matches the Dart
# ecosystem convention used by melos, Riverpod, Bloc, Drift, Mason. Go
# uses `/` because Go module paths already use it; Dart does not.
branch_whitelist = ["main"]
skip_ci = "[skip ci]"
skip_untracked = true
post_bump_hooks = ["git push origin {{version_tag}}"]

[monorepo.packages]
# Per-package versions and tags. cog produces tags as <name>-v<semver>,
# matching the filter in .github/workflows/release-dart.yml.
#
# pre_bump_hooks stamp the new version into each package's pubspec.yaml
# before cog creates the bump commit. cog has no native pubspec.yaml
# writer the way it does for Cargo.toml or package.json; the sed line
# is the canonical workaround used across Dart monorepos that adopt cog.
core = { path = "packages/core", pre_bump_hooks = [
  "sed -i 's/^version: .*/version: {{version}}/' packages/core/pubspec.yaml",
] }
oauth = { path = "packages/oauth", pre_bump_hooks = [
  "sed -i 's/^version: .*/version: {{version}}/' packages/oauth/pubspec.yaml",
] }

[git_hooks]

[commit_types]
chore    = { changelog_title = "", omit_from_changelog = true }
ci       = { changelog_title = "", omit_from_changelog = true }
docs     = { changelog_title = "", omit_from_changelog = true }
refactor = { changelog_title = "", omit_from_changelog = true }
style    = { changelog_title = "", omit_from_changelog = true }
test     = { changelog_title = "", omit_from_changelog = true }

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "sdk-core-dart"
owner = "Pinguteca"
authors = [
  { username = "Pinguteca", signature = "Pinguteca" },
]

[bump_profiles]
