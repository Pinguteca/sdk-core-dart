name: pinguteca_sdk

packages:
  - packages/*

command:
  version:
    linkToCommits: true
    workspaceChangelog: true
    branch: main

scripts:
  analyze:
    description: Run the analyzer across every package
    run: dart analyze --fatal-infos --fatal-warnings

  format-check:
    description: Verify formatting without changes
    run: dart format --output=none --set-exit-if-changed .

  test:
    description: Run tests in every package that defines them
    run: dart test --reporter=expanded
    packageFilters:
      dirExists: test

  test:coverage:
    description: Run tests with coverage collection
    run: dart test --reporter=expanded --coverage=coverage
    packageFilters:
      dirExists: test

  publish-dry:
    description: Verify each publishable package can publish
    run: dart pub publish --dry-run
    packageFilters:
      published: true
