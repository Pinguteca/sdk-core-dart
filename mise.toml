[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
install_before = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]

[tools]
"github:mongodb/kingfisher" = "1.110.0"
pinact = "4.1.1"
prek = "0.4.12"
syft = "1.50.0"
dart = "3.12.1"
cocogitto = "7.0.0"

[tasks."secret:scan"]
run = "kingfisher scan . --no-validate --redact --format json --output kingfisher-results.json"
description = "Scan codebase for secrets with Kingfisher"
alias = "ss"

[tasks."secret:validate"]
run = "kingfisher scan . --redact --validation-rps 2"
description = "Validate (and revoke) live secrets found by Kingfisher"
alias = "sv"

[tasks.bump]
run = "dart run melos version"
description = "Interactive: bump versions for changed packages via melos; creates <pkg-dir>-v<semver> tags"

# Per-package release tasks. The release-dart workflow chains these so the
# logic is identical between CI and a local dry run, and so the developer
# can rehearse a release end-to-end without pushing a tag.
#
# Inputs read from the environment so callers (workflow, manual) wire
# them once and every step inherits:
#
#   RELEASE_PKG_DIR   - directory name under packages/, e.g. "core" or "oauth".
#   RELEASE_VERSION   - semver pulled from the tag.
#   RELEASE_PKG_NAME  - published name from the package's pubspec.yaml.
#
# release:parse-tag derives all three from RELEASE_TAG (e.g. "core-v0.0.2"
# or "oauth-v0.0.1") and prints them as KEY=VALUE lines so the workflow
# can append the output to $GITHUB_ENV in one step. Locally, source the
# output with `eval $(RELEASE_TAG=core-v0.0.2 mise run release:parse-tag)`.

[tasks."release:parse-tag"]
description = "Parse RELEASE_TAG (<pkg-dir>-v<semver>) and emit RELEASE_PKG_DIR/RELEASE_VERSION/RELEASE_PKG_NAME"
run = """
TAG="${RELEASE_TAG:?RELEASE_TAG is required}"
case "$TAG" in
  core-v*|oauth-v*) ;;
  *)
    echo "::error::unsupported release tag '$TAG' (expected <pkg-dir>-v<semver> with pkg-dir in {core,oauth})" >&2
    exit 1
    ;;
esac
DIR="${TAG%-v*}"
VERSION="${TAG##*-v}"
NAME=$(grep '^name:' "packages/${DIR}/pubspec.yaml" | awk '{print $2}')
if [ -z "$NAME" ]; then
  echo "::error::could not read package name from packages/${DIR}/pubspec.yaml" >&2
  exit 1
fi
echo "RELEASE_PKG_DIR=$DIR"
echo "RELEASE_VERSION=$VERSION"
echo "RELEASE_PKG_NAME=$NAME"
"""

[tasks."release:verify-version"]
description = "Fail when packages/$RELEASE_PKG_DIR/pubspec.yaml does not carry RELEASE_VERSION"
run = """
DIR="${RELEASE_PKG_DIR:?RELEASE_PKG_DIR is required}"
EXPECTED="${RELEASE_VERSION:?RELEASE_VERSION is required}"
ACTUAL=$(grep '^version:' "packages/${DIR}/pubspec.yaml" | awk '{print $2}')
if [ "$EXPECTED" != "$ACTUAL" ]; then
  echo "::error::Tag expects version $EXPECTED but packages/${DIR}/pubspec.yaml has $ACTUAL" >&2
  exit 1
fi
"""

[tasks."release:dry-run"]
description = "dart pub publish --dry-run from packages/$RELEASE_PKG_DIR"
run = """
DIR="${RELEASE_PKG_DIR:?RELEASE_PKG_DIR is required}"
cd "packages/${DIR}" && dart pub publish --dry-run
"""

[tasks."release:publish"]
description = "dart pub publish --force from packages/$RELEASE_PKG_DIR (CI only; requires trusted-publisher token from setup-dart)"
run = """
DIR="${RELEASE_PKG_DIR:?RELEASE_PKG_DIR is required}"
cd "packages/${DIR}" && dart pub publish --force
"""

[tasks."release:sbom"]
description = "Generate CycloneDX SBOM for packages/$RELEASE_PKG_DIR"
alias = "rsbom"
run = """
DIR="${RELEASE_PKG_DIR:?RELEASE_PKG_DIR is required}"
NAME="${RELEASE_PKG_NAME:?RELEASE_PKG_NAME is required}"
mkdir -p out/sbom
syft scan "dir:packages/${DIR}" -o "cyclonedx-json=out/sbom/${NAME}.cdx.json"
"""
sources = [
    "pubspec.yaml",
    "pubspec.lock",
    "packages/*/pubspec.yaml",
]
outputs = ["out/sbom/**/*"]

[tasks.lint]
description = "Run all linting"
depends = ["lint:*"]

[tasks.get]
run = "dart pub get"
description = "Resolve every workspace package into the shared pubspec.lock"
alias = "g"
sources = ["pubspec.yaml", "packages/*/pubspec.yaml"]
outputs = ["pubspec.lock"]

[tasks.test]
run = "dart run melos run test"
description = "Run Dart tests across every workspace package"
alias = "t"
sources = ["packages/**/*.dart", "packages/*/pubspec.yaml", "dart_test.yaml"]
outputs = ["packages/*/coverage/**/*"]

[tasks.analyze]
run = "dart analyze"
description = "Run the Dart static analyzer across the workspace"
alias = "a"
sources = ["packages/**/*.dart", "analysis_options.yaml"]

[tasks.format]
run = "dart format ."
description = "Format Dart code in place across the workspace"
alias = "fmt"

[tasks."format:check"]
run = "dart format --output=none --set-exit-if-changed ."
description = "Verify Dart formatting without changes"
alias = "fmtc"

[tasks."lint:dart"]
run = "dart analyze --fatal-infos --fatal-warnings"
description = "Treat analyzer infos and warnings as failures"
sources = ["packages/**/*.dart", "analysis_options.yaml"]

[tasks.publish-dry]
run = "dart run melos run publish-dry"
description = "Verify every publishable package can publish"
